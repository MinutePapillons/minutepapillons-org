baseURL = "/"
# Emit page-relative asset URLs (./img/..., ../css/...). Every deployment
# target (project Pages subpath, alx.github.io, a custom domain) then works
# from the same build: no URL rewriting step at deploy time.
relativeURLs = true
defaultContentLanguage = "fr"
title = "Minute papillons"

# No content uses taxonomies. Left at Hugo's defaults it would still emit
# empty /tags/ and /categories/ pages (serialised as index.xml) with no
# matching layout, which shows up as a build warning and as dead URLs.
taxonomies = { }

# Multilingual: FR is the default language (served at the site root, e.g.
# /louez-moi/), EN lives under the /en/ language subdirectory.
# Docs: https://gohugo.io/content-management/multilingual/
# NB (Hugo >= 0.159): languages.*.contentDir is relative to the project
# root, so it must include the "content/" prefix.

[languages.fr]
weight = 1
locale = "fr-FR"
label = "Français"
contentDir = "content/fr"
title = "Minute papillons"

[languages.en]
weight = 2
locale = "en-US"
label = "English"
contentDir = "content/en"
title = "Minute Papillons"

[params]
# Canonical ORIGIN + path for the OpenGraph tags (og:url, og:image).
# Both Pages deployments share one build: the OG tags always point at the org
# site, even when served from alx.github.io. Keep this as a full URL with a
# trailing slash; templates append the page path themselves.
ogBase = "https://minutepapillons.github.io/minutepapillons-org/"

[markup.goldmark.renderer]
# Content files (.md) embed the original WordPress block markup as raw HTML;
# allow it to pass through the markdown renderer unchanged.
unsafe = true

[security]
# content/ est du HTML : le markup WordPress a ete miroite en fichiers .html,
# avec `markup: html` en front matter. Hugo >= 0.160 refuse le contenu
# text/html tant qu'il n'est pas autorise explicitement ici.
allowContent = ['^text/html$']
