baseURL = "/"
defaultContentLanguage = "fr"
title = "Minute papillons"

# Multilingual: FR is the default language (served at the site root, e.g.
# /louez-moi/), EN lives under the /en/ language subdirectory.
# Docs: https://gohugo.io/content-management/multilingual/
# NB (Hugo >= 0.159): languages.*.contentDir is relative to the project
# root, so it must include the "content/" prefix.

[languages.fr]
weight = 1
locale = "fr-FR"
label = "Français"
contentDir = "content/fr"
title = "Minute papillons"

[languages.en]
weight = 2
locale = "en-US"
label = "English"
contentDir = "content/en"
title = "Minute Papillons"

[params]
# Base URL canonique pour les tags OpenGraph (og:url, og:image).
# Les deux deploiements Pages partagent la meme build: les tags OG
# pointent toujours vers le site org, meme depuis alx.github.io.
ogBase = "https://minutepapillons.github.io/minutepapillons-org/"

[markup.goldmark.renderer]
# Content files (.md) embed the original WordPress block markup as raw HTML;
# allow it to pass through the markdown renderer unchanged.
unsafe = true
